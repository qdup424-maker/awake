<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }

    position: fixed; left: 12px; bottom: 10px; color: rgba(200,220,240,.55);
    font: 12px/1.4 -apple-system, "Segoe UI", sans-serif; letter-spacing: .04em;
    transition: opacity 1s; pointer-events: none; z-index: 2;
  }
  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: rgba(200,220,240,.6); font: 13px -apple-system, "Segoe UI", sans-serif; letter-spacing: .2em;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="loading">LOADING</div>
<div id="hint">空格键：从头播放 · 25 秒循环</div>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

// =====================================================================
//  Parameters / timeline
// =====================================================================
const LOOP = 25.0;
const params = new URLSearchParams(location.search);
const FIXED_T = params.has('t') ? parseFloat(params.get('t')) : null;   // ?t=12.5 freezes a frame (for checking)
const HQ = params.has('hq');
const MAX_SIDE = HQ ? 2160 : 1440;      // backing-store cap for the square canvas

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const easeIO = (t) => { t = clamp(t, 0, 1); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
// gentle ease: mostly linear with soft ends (keeps camera moving)
const glide = (t) => { t = clamp(t, 0, 1); return lerp(t, t * t * (3 - 2 * t), 0.6); };

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ---------- JS value noise (geometry generation only) ----------
function hash3(x, y, z) {
  let h = (x * 374761393 + y * 668265263 + z * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise3(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const c = (a, b, d) => hash3(xi + a, yi + b, zi + d);
  const x00 = lerp(c(0, 0, 0), c(1, 0, 0), u), x10 = lerp(c(0, 1, 0), c(1, 1, 0), u);
  const x01 = lerp(c(0, 0, 1), c(1, 0, 1), u), x11 = lerp(c(0, 1, 1), c(1, 1, 1), u);
  return lerp(lerp(x00, x10, v), lerp(x01, x11, v), w);
}
function fbm3(x, y, z, oct = 4) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise3(x, y, z); n += a; x = x * 2.03 + 17.1; y = y * 2.03 + 3.7; z = z * 2.03 + 9.2; a *= 0.5; }
  return s / n;
}
function ridged(x, z, oct = 6) {
  let s = 0, a = 0.5, n = 0, prev = 1;
  for (let i = 0; i < oct; i++) {
    let r = 1 - Math.abs(vnoise3(x, 0.5 + i * 13.7, z) * 2 - 1);
    r = r * r * prev; prev = clamp(r * 1.6, 0, 1);
    s += a * r; n += a; x *= 2.07; z *= 2.07; a *= 0.5;
  }
  return s / n;
}

// =====================================================================
//  Waves (single definition -> GLSL + JS stay identical)
// =====================================================================
const WAVES = [
  // angle, amplitude, wavelength
  [0.55, 0.20, 38.0],
  [1.35, 0.13, 21.0],
  [-0.50, 0.085, 12.5],
  [2.30, 0.05, 7.0],
  [0.15, 0.03, 4.2],
  [-1.20, 0.018, 2.6],
].map(([a, A, L], i) => {
  const k = 2 * Math.PI / L;
  return { dx: Math.cos(a), dz: Math.sin(a), A, k, w: Math.sqrt(9.81 * k), ph: i * 1.7 };
});
function waveH(x, z, t) {
  let h = 0;
  for (const W of WAVES) h += W.A * Math.sin(W.k * (W.dx * x + W.dz * z) - W.w * t + W.ph);
  return h;
}
const f5 = (v) => v.toFixed(5);
const WAVE_GLSL = `
float waveH(vec2 p, float t){
  float h = 0.0;
  ${WAVES.map(W => `h += ${f5(W.A)} * sin(${f5(W.k)} * dot(vec2(${f5(W.dx)}, ${f5(W.dz)}), p) - ${f5(W.w)} * t + ${f5(W.ph)});`).join('\n  ')}
  return h;
}
vec2 waveG(vec2 p, float t){
  vec2 g = vec2(0.0);
  ${WAVES.map(W => `g += ${f5(W.A * W.k)} * vec2(${f5(W.dx)}, ${f5(W.dz)}) * cos(${f5(W.k)} * dot(vec2(${f5(W.dx)}, ${f5(W.dz)}), p) - ${f5(W.w)} * t + ${f5(W.ph)});`).join('\n  ')}
  return g;
}`;

// =====================================================================
//  Shared GLSL
// =====================================================================
const FOG_COL = new THREE.Color(0.016, 0.030, 0.050);
const FOG_DENS = 0.00062;
const FOG_GLSL = `
const vec3 FOG_COL = vec3(${f5(FOG_COL.r)}, ${f5(FOG_COL.g)}, ${f5(FOG_COL.b)});
vec3 applyFog(vec3 col, vec3 wp){
  float d = length(wp - cameraPosition);
  float f = 1.0 - exp(-${f5(FOG_DENS * FOG_DENS)} * d * d);
  // low-lying sea mist
  float hf = (1.0 - exp(-d * 0.0042)) * exp(-max(wp.y, 0.0) / 22.0) * 0.55;
  f = clamp(f + hf * (1.0 - f), 0.0, 1.0);
  return mix(col, FOG_COL, f);
}`;

const NOISE_GLSL = `
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float hash13(vec3 p3){ p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
float noise2(vec2 p){
  vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x), mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y);
}
// value noise with analytic derivative: (value, d/dx, d/dy)
vec3 noised2(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f); vec2 du = 6.0 * f * (1.0 - f);
  float a = hash12(i), b = hash12(i + vec2(1,0)), c = hash12(i + vec2(0,1)), d = hash12(i + vec2(1,1));
  return vec3(a + (b - a) * u.x + (c - a) * u.y + (a - b - c + d) * u.x * u.y,
              du * (vec2(b - a, c - a) + (a - b - c + d) * u.yx));
}
float noise3(vec3 p){
  vec3 i = floor(p), f = fract(p); vec3 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash13(i), hash13(i + vec3(1,0,0)), u.x), mix(hash13(i + vec3(0,1,0)), hash13(i + vec3(1,1,0)), u.x), u.y),
             mix(mix(hash13(i + vec3(0,0,1)), hash13(i + vec3(1,0,1)), u.x), mix(hash13(i + vec3(0,1,1)), hash13(i + vec3(1,1,1)), u.x), u.y), u.z);
}
float fbm2(vec2 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * noise2(p); p = p * 2.03 + vec2(1.7, 9.2); a *= 0.5; } return s / 0.9375; }
float fbm3(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++){ s += a * noise3(p); p = p * 2.03 + vec3(1.7, 9.2, 4.1); a *= 0.5; } return s / 0.9375; }
`;

// Use the same fog (distance + height mist) for all built-in materials
THREE.ShaderChunk.fog_pars_vertex = `#ifdef USE_FOG
varying vec3 vFogWorld;
#endif`;
THREE.ShaderChunk.fog_vertex = `#ifdef USE_FOG
{
  vec4 fogW = vec4(transformed, 1.0);
  #ifdef USE_INSTANCING
    fogW = instanceMatrix * fogW;
  #endif
  vFogWorld = (modelMatrix * fogW).xyz;
}
#endif`;
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
varying vec3 vFogWorld;
${FOG_GLSL}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
gl_FragColor.rgb = applyFog(gl_FragColor.rgb, vFogWorld);
#endif`;

// =====================================================================
//  Renderer / scene / camera
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance', preserveDrawingBuffer: FIXED_T !== null });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COL.clone(), FOG_DENS);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 9000);

// Shared uniforms
const MOON_DIR = new THREE.Vector3(0.42, 0.40, 0.81).normalize();
const U = {
  uTime: { value: 0 },
  uMoonDir: { value: MOON_DIR },
  uMoonCol: { value: new THREE.Color(0.42, 0.52, 0.72) },
  uAmb: { value: new THREE.Color(0.020, 0.040, 0.060) },
  uAur: { value: new THREE.Color(0.045, 0.16, 0.10) },
  uLP: { value: [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()] },
  uLC: { value: [new THREE.Color(), new THREE.Color(), new THREE.Color()] },
};

// Lights for built-in (PBR) materials
const hemi = new THREE.HemisphereLight(new THREE.Color(0.10, 0.17, 0.26), new THREE.Color(0.02, 0.03, 0.05), 0.6);
scene.add(hemi);
const moon = new THREE.DirectionalLight(new THREE.Color(0.62, 0.72, 0.95), 1.15);
moon.position.copy(MOON_DIR).multiplyScalar(1000);
scene.add(moon);
const auroraLight = new THREE.DirectionalLight(new THREE.Color(0.25, 1.0, 0.55), 0.2);
auroraLight.position.set(-200, 600, 400);
scene.add(auroraLight);

// =====================================================================
//  Sky: gradient + raymarched aurora curtains + moon, stars as points
// =====================================================================
const skyUniforms = {
  uTime: U.uTime,
  uSteps: { value: 40 },
  uMoonDir: U.uMoonDir,
};
const skyMat = new THREE.ShaderMaterial({
  uniforms: skyUniforms,
  side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `
    varying vec3 vDir;
    void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float uTime; uniform int uSteps; uniform vec3 uMoonDir;
    varying vec3 vDir;
    ${NOISE_GLSL}
    const vec3 FOG_COL = vec3(${f5(FOG_COL.r)}, ${f5(FOG_COL.g)}, ${f5(FOG_COL.b)});

    // one horizontal slice of the aurora at layer coordinate p
    float curtain(vec2 p){
      float t = uTime;
      vec2 w = vec2(noise2(p * 0.15 + vec2(t * 0.03, 0.0)), noise2(p * 0.15 + vec2(5.2, 1.3 - t * 0.025)));
      vec2 q = p + (w - 0.5) * 4.5;
      float y = q.y + 1.3 * sin(q.x * 0.22 + t * 0.10) + 0.45 * sin(q.x * 0.61 - t * 0.17);
      float band = abs(fract(y * 0.10 + 0.25) - 0.5) * 2.0;     // distance to curtain centre line
      float b = exp(-band * band * 60.0) + 0.05 * exp(-band * band * 6.0);
      // vertical rays: depend only on position along the curtain, not on height
      float r1 = noise2(vec2(q.x * 1.15 + t * 0.22, 0.5));
      float r2 = noise2(vec2(q.x * 3.1 - t * 0.35, 4.5));
      float rays = 0.12 + 1.9 * r1 * r1 * r1 + 0.45 * r2 * r2;
      float m = smoothstep(0.28, 0.62, noise2(p * 0.045 + vec2(-t * 0.008, 3.0)));
      return b * rays * m;
    }

    vec3 aurora(vec3 d){
      if (d.y <= 0.0) return vec3(0.0);
      vec3 acc = vec3(0.0);
      float steps = float(uSteps);
      // interleaved gradient noise dithers the slice spacing
      float jitter = fract(52.9829189 * fract(dot(gl_FragCoord.xy, vec2(0.06711056, 0.00583715))));
      for (int i = 0; i < 64; i++){
        if (i >= uSteps) break;
        float fi = (float(i) + jitter) / steps;
        float h = 1.0 + fi * fi * 3.2;
        float tt = h / (d.y + 0.03);
        vec2 p = d.xz * tt * 1.9 + vec2(3.0, 9.0);
        float a = curtain(p) * exp(-tt * 0.012);
        vec3 c = mix(vec3(0.12, 1.00, 0.45), vec3(0.55, 0.16, 1.0), smoothstep(0.28, 0.80, fi));
        c = mix(c, vec3(0.95, 0.22, 0.70), smoothstep(0.65, 1.0, fi) * 0.45);
        float wgt = exp(-fi * 1.8) * smoothstep(0.0, 0.05, fi) * (1.0 + 1.2 * fi);
        acc += c * a * wgt;
      }
      acc /= steps;
      return acc * 3.6 * smoothstep(0.02, 0.28, d.y);
    }

    void main(){
      vec3 d = normalize(vDir);
      float y = d.y;
      vec3 zen = vec3(0.0025, 0.0050, 0.0130);
      vec3 hor = vec3(0.012, 0.024, 0.042);
      vec3 col = mix(hor, zen, pow(clamp(y, 0.0, 1.0), 0.45));
      col += aurora(d);
      // faint green airglow along the horizon
      col += vec3(0.004, 0.020, 0.012) * exp(-max(y, 0.0) * 9.0);
      // moon + halo
      float md = dot(d, uMoonDir);
      col += vec3(0.85, 0.9, 1.0) * smoothstep(0.99985, 0.99990, md) * 6.0;
      col += vec3(0.30, 0.38, 0.55) * pow(max(md, 0.0), 900.0) * 0.9;
      col += vec3(0.10, 0.14, 0.22) * pow(max(md, 0.0), 40.0) * 0.12;
      // blend into fog at the horizon
      float hz = exp(-max(y, 0.0) * 16.0);
      col = mix(col, FOG_COL, hz * 0.9);
      if (y < 0.0) col = FOG_COL;
      gl_FragColor = vec4(col, 1.0);
    }`,
});
const skyGroup = new THREE.Group();
const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 64, 32), skyMat);
sky.frustumCulled = false;
skyGroup.add(sky);
scene.add(skyGroup);

// stars
{
  const rng = mulberry32(77);
  const N = 2600;
  const pos = new Float32Array(N * 3), mag = new Float32Array(N), ph = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const u = rng(), v = rng();
    const y = 0.03 + Math.pow(v, 0.8) * 0.97;
    const r = Math.sqrt(1 - y * y), a = u * Math.PI * 2;
    pos.set([Math.cos(a) * r * 4800, y * 4800, Math.sin(a) * r * 4800], i * 3);
    mag[i] = Math.pow(rng(), 6.0);
    ph[i] = rng() * 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aMag', new THREE.BufferAttribute(mag, 1));
  g.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: U.uTime, uPx: { value: 1 } },
    transparent: true, depthWrite: false, fog: false, blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aMag; attribute float aPh; uniform float uTime; uniform float uPx;
      varying float vB;
      void main(){
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        float tw = 0.8 + 0.2 * sin(uTime * (1.3 + fract(aPh) * 2.0) + aPh);
        float h = normalize(position).y;
        vB = (0.10 + aMag * 1.6) * tw * smoothstep(0.02, 0.2, h);
        gl_PointSize = (1.6 + aMag * 2.2) * uPx;
      }`,
    fragmentShader: `
      varying float vB;
      void main(){
        vec2 c = gl_PointCoord - 0.5; float r = dot(c, c) * 4.0;
        float a = exp(-r * 3.5);
        gl_FragColor = vec4(vec3(0.75, 0.85, 1.0) * vB * a, 1.0);
      }`,
  });
  const stars = new THREE.Points(g, m);
  stars.frustumCulled = false;
  stars.renderOrder = -5;
  skyGroup.add(stars);
  skyGroup.userData.starMat = m;
}

// =====================================================================
//  Fjord mountains (heightfield)
// =====================================================================
function terrainH(x, z) {
  const cx = 70 * Math.sin(z * 0.0016) + 35 * Math.sin(z * 0.0041 + 1.0);
  const d = Math.abs(x - cx);
  const wall = smooth(230, 620, d);
  const endN = smooth(1050, 1750, z) * 0.95;
  const endS = smooth(1150, 2000, -z) * 0.75;
  const m = Math.max(wall, endN, endS);
  const r = ridged(x * 0.0021 + 7.3, z * 0.0021 - 2.1);
  const big = fbm3(x * 0.0007, 3.3, z * 0.0007, 3);
  return m * (60 + 560 * r * (0.45 + 0.9 * big)) - 30 * (1 - m);
}
{
  const S = 4600, SEG = 340;
  const g = new THREE.PlaneGeometry(S, S, SEG, SEG);
  g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, terrainH(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const n = g.attributes.normal;
  const col = new Float32Array(p.count * 3);
  const rock = new THREE.Color(0.045, 0.050, 0.058), snow = new THREE.Color(0.80, 0.86, 0.95), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const nz = fbm3(x * 0.02, y * 0.02, z * 0.02, 3);
    const s = smooth(0.50, 0.78, n.getY(i) + (nz - 0.5) * 0.35) * smooth(-5, 30, y);
    c.copy(rock).lerp(snow, s);
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3));
  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.92, metalness: 0.0 });
  const terrain = new THREE.Mesh(g, mat);
  scene.add(terrain);
}

// =====================================================================
//  Ice material (custom: strata, parallax interior, cracks, snow, ship light)
// =====================================================================
function makeIceMaterial(opts = {}) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: U.uTime, uMoonDir: U.uMoonDir, uMoonCol: U.uMoonCol, uAmb: U.uAmb, uAur: U.uAur,
      uLP: U.uLP, uLC: U.uLC, uAlpha: { value: opts.alpha ?? 1.0 },
      uGlow: { value: opts.glow ?? 1.0 },
    },
    transparent: !!opts.transparent,
    depthWrite: opts.transparent ? false : true,
    depthFunc: opts.transparent ? THREE.LessEqualDepth : THREE.LessEqualDepth,
    fog: false,
    vertexShader: `
      attribute float aAO;
      varying vec3 vWP; varying vec3 vN; varying vec3 vOP; varying vec3 vVO; varying float vAO;
      void main(){
        mat4 m = modelMatrix;
        #ifdef USE_INSTANCING
          m = modelMatrix * instanceMatrix;
        #endif
        vec4 wp = m * vec4(position, 1.0);
        vWP = wp.xyz;
        vN = normalize(mat3(m) * normal);
        vOP = position + m[3].xyz * 0.13;
        vec3 camO = (inverse(m) * vec4(cameraPosition, 1.0)).xyz;
        vVO = camO - position;
        vAO = aAO;
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uTime, uAlpha, uGlow;
      uniform vec3 uMoonDir, uMoonCol, uAmb, uAur;
      uniform vec3 uLP[3]; uniform vec3 uLC[3];
      varying vec3 vWP; varying vec3 vN; varying vec3 vOP; varying vec3 vVO; varying float vAO;
      ${NOISE_GLSL}
      ${FOG_GLSL}
      const vec3 ICE_DEEP = vec3(0.004, 0.045, 0.13);
      const vec3 ICE_MID  = vec3(0.03, 0.26, 0.52);
      const vec3 ICE_LITE = vec3(0.40, 0.75, 0.95);
      void main(){
        vec3 N0 = normalize(vN);
        if (!gl_FrontFacing) N0 = -N0;
        vec3 V = normalize(cameraPosition - vWP);
        vec3 p = vOP;
        float dist = length(cameraPosition - vWP);
        // micro relief (fades out with distance to avoid shimmering)
        float bf = exp(-dist * 0.006);
        vec3 bmp = vec3(noise3(p * 0.85), noise3(p * 0.85 + 4.1), noise3(p * 0.85 + 8.3)) - 0.5;
        vec3 N = normalize(N0 + bmp * 0.3 * bf);

  if (FIXED_T === null) adapt();
  const t = FIXED_T !== null ? FIXED_T : ((performance.now() - start) / 1000) % LOOP;
  update(t);
  spray.material.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  composer.render();
}
// expose for frame-accurate capture: window.renderAt(seconds)
window.renderAt = (t) => { update(t); spray.material.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2)); composer.render(); };

document.getElementById('loading').remove();
window.renderCam = (t, p, l, fov) => { update(t); camera.position.set(...p); camera.lookAt(...l); camera.fov = fov; camera.updateProjectionMatrix(); skyGroup.position.copy(camera.position); composer.render(); };
if (FIXED_T !== null) {
  frame(); frame();
  window.__ready = true;
} else {
  renderer.setAnimationLoop(frame);
}
</script>
